name: Snyk Full Scan 


on:
  pull_request:
    branches:
      - develop

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean install dependencies
        run: npm ci

      - name: Snyk Open Source + License scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          TEST_JWT_SECRET: ${{ vars.TEST_JWT_SECRET }}
          TEST_ADMIN_PASSWORD: ${{ vars.TEST_ADMIN_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ vars.TEST_ADMIN_EMAIL }}
          TEST_ACCESS_TOKEN: ${{ secrets.TEST_ACCESS_TOKEN }}
        with:
          command: test --license --strict-out-of-sync=false

      - name: Snyk Code (SAST)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test --strict-out-of-sync=false

      - name: Build Docker image
        run: docker build -t lf-admin:latest .

      - name: Snyk Container scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: lf-admin:latest
          args: --file=Dockerfile 
