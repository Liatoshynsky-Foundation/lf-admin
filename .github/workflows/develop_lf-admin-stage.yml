# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - lf-admin-stage

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: https://lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/
          username: ${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}
          password: ${{ secrets.AzureAppService_ContainerPassword_598f38b8ca0445c7acbcc7d7ac3d30a6 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}/lf-stage-admin:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'lf-admin-stage'
          slot-name: 'production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_d5b9cec1e4254c8a8fcc7b0ef69249ad }}
          images: 'lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}/lf-stage-admin:${{ github.sha }}'
  
  deploy-azure-qa:
    name: Deploy to QA Web App
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: "qa"
      url: ${{ steps.deploy-to-qa-webapp.outputs.webapp-url }}
    if: github.ref == 'refs/heads/develop'
      
    steps:
      - name: Deploy to lf-client-qa-stage
        id: deploy-to-qa-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "lf-client-qa-stage" 
          slot-name: "production"
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_QA }} 
          images: "lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_960C1C49B72746A985193B504F55B231 }}/lf-stage-admin:${{ github.sha }}"
            