name: CI

on:
  pull_request:
    branches:
      - develop
      - main

# Prevent multiple concurrent runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write
  packages: write

env:
  NODE_VERSION: "22"
  MONGO_VERSION: "8"
  MONGO_CONTAINER: "mongodb"
  MONGO_PORT: "27017"
  MONGO_DB: "mongodb"
  MONGO_USERNAME: "admin"
  MONGO_PASSWORD: "password"
  MONGO_URL: "mongodb://admin:password@mongodb:27017/mongodb"

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run ESLint
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build project
        run: npm run build

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup MongoDB
        uses: ./.github/actions/setup-mongodb
        with:
          mongodb-version: ${{ env.MONGO_VERSION }}
          mongodb-container-name: ${{ env.MONGO_CONTAINER }}
          mongodb-port: ${{ env.MONGO_PORT }}
          mongodb-db: ${{ env.MONGO_DB }}
          mongodb-username: ${{ env.MONGO_USERNAME }}
          mongodb-password: ${{ env.MONGO_PASSWORD }}

      - name: Run Tests
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          MONGO_URL: ${{ env.MONGO_URL }}
        run: npm run test

  build-docker:
    name: Build and Test Docker Container
    runs-on: ubuntu-latest
    needs: [lint, type-check, build, tests]
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: lf-admin:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Snyk CLI
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Prepare SARIF directory
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: mkdir -p sarif

      - name: Snyk Container test (SARIF)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: snyk container test lf-admin:test --file=Dockerfile --exclude-app-vulns --sarif-file-output=./sarif/snyk-container.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Container monitor
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: snyk container monitor lf-admin:test --file=Dockerfile
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk Container SARIF
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && hashFiles('sarif/snyk-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif/snyk-container.sarif
          category: snyk-container

      - name: Cleanup test image
        if: always()
        run: docker rmi lf-admin:test || true

  security-scan:
    name: Run Security Scan
    runs-on: ubuntu-latest
    needs: [lint, tests]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    timeout-minutes: 15
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare SARIF directory
        run: mkdir -p sarif

      - name: Snyk Code test (SARIF)
        run: snyk code test --sarif-file-output=./sarif/snyk-code.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Open Source monitor
        run: snyk monitor --file=package-lock.json --package-manager=npm --strict-out-of-sync=false
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Open Source test (SARIF)
        run: snyk test --all-projects --sarif-file-output=./sarif/snyk-oss.sarif --strict-out-of-sync=false || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk Code SARIF
        if: hashFiles('sarif/snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif/snyk-code.sarif
          category: snyk-code

      - name: Upload Snyk OSS SARIF
        if: hashFiles('sarif/snyk-oss.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif/snyk-oss.sarif
          category: snyk-oss
