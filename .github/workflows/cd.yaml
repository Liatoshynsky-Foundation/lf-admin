name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - feature/165/add-snyk

jobs:
  build:
    name: Build container image
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: https://lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/
          username: ${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}
          password: ${{ secrets.AzureAppService_ContainerPassword_598f38b8ca0445c7acbcc7d7ac3d30a6 }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push container image to registries
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}/lf-stage-admin:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-admin:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-admin:latest
          file: ./Dockerfile

  deploy-azure:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "lf-admin-stage"
          slot-name: "production"
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_d5b9cec1e4254c8a8fcc7b0ef69249ad }}
          images: "lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}/lf-stage-admin:${{ github.sha }}"

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "production"
      url: ${{ steps.set-vps-url.outputs.vps-url }}

    steps:
      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Deploy to VPS with Docker Compose
        id: deploy-to-vps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "🔐 Logging into GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📁 Changing to project directory..."
            cd /root/docker/lf-prj

            echo "📊 Debug info:"
            echo "Repository owner: ${{ github.repository_owner }}"
            echo "Lowercase owner: ${{ env.REPO_OWNER_LOWER }}"
            echo "Git commit: ${{ github.sha }}"

            echo "📦 Pulling new admin image..."
            docker pull ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-admin:${{ github.sha }}

            echo "🏷️  Tagging image as latest..."
            docker tag ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-admin:${{ github.sha }} ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-admin:latest

            echo "🛑 Stopping admin services..."
            docker-compose stop admin admin-tailscale

            echo "🗑️  Removing old containers..."
            docker-compose rm -f admin admin-tailscale

            echo "🚀 Starting updated admin services..."
            docker-compose up -d admin admin-tailscale

            echo "Waiting for admin services to start..."
            sleep 15

            echo "Checking service status..."
            docker-compose ps admin admin-tailscale

            echo "Performing health checks..."
            for i in {1..3}; do
              if docker exec lf-admin wget -q -O- http://localhost:3001/ >/dev/null 2>&1; then
                echo "Admin health check passed (attempt $i)"
                break
              else
                echo "Admin health check failed (attempt $i)"
                if [ $i -eq 3 ]; then
                  echo "All health checks failed, rolling back..."
                  docker-compose stop admin admin-tailscale
                  docker-compose up -d admin admin-tailscale
                  exit 1
                fi
                sleep 15
              fi
            done

            echo "Checking logs for errors..."
            if docker-compose logs admin | tail -20 | grep -i "error\|fatal\|exception"; then
              echo "Errors found in admin logs"
              docker-compose logs admin
              exit 1
            fi

            echo "Checking Tailscale connection..."
            if docker exec admin-tailscale tailscale status | grep -q "admin"; then
              echo "Tailscale connection successful"

              echo "Testing admin accessibility via Tailscale..."
              sleep 5
              if curl -f https://admin.tail6afd63.ts.net/ >/dev/null 2>&1; then
                echo "Admin accessible via Tailscale at https://admin.tail6afd63.ts.net"
              else
                echo "Admin not accessible via Tailscale (DNS propagation may take time)"
              fi
            else
              echo "Tailscale connection issue"
              docker-compose logs admin-tailscale
            fi

            echo "Cleaning up old images..."
            docker image prune -f
            docker images ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-admin --format "table {{.Tag}}\t{{.CreatedAt}}" | tail -n +4 | awk '{print $1}' | xargs -r docker rmi || true

            echo "Current service status:"
            docker-compose ps

            echo "Deployment completed successfully!"
            echo "Admin URL: https://admin.tail6afd63.ts.net"

      - name: Set VPS deployment URL
        id: set-vps-url
        run: echo "vps-url=https://admin.tail6afd63.ts.net" >> $GITHUB_OUTPUT
