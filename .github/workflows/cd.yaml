name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build container image
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: https://lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/
          username: ${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}
          password: ${{ secrets.AzureAppService_ContainerPassword_598f38b8ca0445c7acbcc7d7ac3d30a6 }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image to registries
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}/lf-stage-admin:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lf-admin:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lf-admin:latest
          file: ./Dockerfile

  deploy-azure:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "lf-admin-stage"
          slot-name: "production"
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_d5b9cec1e4254c8a8fcc7b0ef69249ad }}
          images: "lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}/lf-stage-admin:${{ github.sha }}"
