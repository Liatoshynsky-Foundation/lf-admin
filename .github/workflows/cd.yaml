name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - "release/*"

jobs:
  build:
    name: Build container image
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: https://lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/
          username: ${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}
          password: ${{ secrets.AzureAppService_ContainerPassword_598f38b8ca0445c7acbcc7d7ac3d30a6 }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set image tag based on branch
        id: set-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "tag=stage" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push container image to registries
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}/lf-stage-admin:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-admin:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/lf-admin:${{ steps.set-tag.outputs.tag }}
          file: ./Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure-dev:
    name: Deploy to Azure Web App(Dev)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 15
    environment:
      name: "production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Deploy to lf-admin-stage
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "lf-admin-stage"
          slot-name: "production"
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_d5b9cec1e4254c8a8fcc7b0ef69249ad }}
          images: "lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}/lf-stage-admin:${{ github.sha }}"
  
  deploy-azure-qa:
    name: Deploy to Azure Web App(QA)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 15
    environment:
      name: "qa"
      url: ${{ steps.deploy-to-qa-webapp.outputs.webapp-url }}
    steps:
      - name: Deploy to lf-admin-qa-stage
        id: deploy-to-qa-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "lf-admin-qa-stage"
          slot-name: "production"
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_QA }}
          images: "lfacrstage-bkg7bmd7gacxh9e5.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_960c1c49b72746a985193b504f55b231 }}/lf-stage-admin:${{ github.sha }}"
