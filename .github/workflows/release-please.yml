name: Changelog

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest

    permissions:
      contents: write   
      pull-requests: write  

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
