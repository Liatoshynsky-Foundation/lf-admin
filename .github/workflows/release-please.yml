name: release-please

on:
  push:
    branches:
      - chore/164/changelog-action

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write   
      pull-requests: write  

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
