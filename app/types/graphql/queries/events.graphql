fragment EventFields on Event {
  id
  adminTitle
  eventLink
  slug
  status
  title {
    uk
    en
  }
  description {
    uk
    en
  }
  keywords {
    uk
    en
  }
  allowIndexation {
    uk
    en
  }
  content {
    uk
    en
  }
  coverImage {
    src {
      uk
      en
    }
    alt {
      uk
      en
    }
    caption {
      uk
      en
    }
    crop {
      x
      y
      width
      height
    }
  }
  publishedAt
  createdAt
  updatedAt
  meta {
    views
  }
  ticketUrl
  eventDateTimeStart
  eventDateTimeEnd
}

query EventById($id: ID!) {
  eventById(id: $id) {
    ...EventFields
  }
}

query EventBySlug($slug: String!) {
  eventBySlug(slug: $slug) {
    ...EventFields
  }
}

query AllEvents($filters: EventFiltersInput) {
  allEvents(filters: $filters) {
    id
    adminTitle
    title {
      uk
      en
    }
    slug
    status
    eventLink
    eventDateTimeStart
    eventDateTimeEnd
    publishedAt
    meta {
      views
    }
    ticketUrl
    eventDateTimeStart
    eventDateTimeEnd
  }
}

query PublishedEvents($filters: EventFiltersInput) {
  publishedEvents(filters: $filters) {
    id
    title {
      uk
      en
    }
    slug
    coverImage {
      src {
        uk
        en
      }
      alt {
        uk
        en
      }
    }
    eventLink
    eventDateTimeStart
    eventDateTimeEnd
    publishedAt
    meta {
      views
    }
    ticketUrl
    eventDateTimeStart
    eventDateTimeEnd
  }
}

query PaginatedEvents($page: Int!, $limit: Int!, $filters: EventFiltersInput) {
  paginatedEvents(page: $page, limit: $limit, filters: $filters) {
    items {
      id
      adminTitle
      eventLink
      slug
      status
      title {
        uk
        en
      }
      coverImage {
        src {
          uk
          en
        }
        alt {
          uk
          en
        }
      }
      publishedAt
      meta {
        views
      }
    }
    total
    page
    totalPages
  }
}

query EventsCount($status: EventStatus) {
  eventsCount(status: $status)
}
