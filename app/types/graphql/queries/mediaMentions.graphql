query MediaMentionById($id: ID!) {
  mediaMentionById(id: $id) {
    id
    url
    adminTitle
    title { uk en }
    description { uk en }
    keywords { uk en }
    allowIndexation { uk en }
    coverImage {
      src
      alt { uk en }
      width
      height
    }
    slug
    status
    publishedAt
    createdAt
    updatedAt
    meta { views }
  }
}

