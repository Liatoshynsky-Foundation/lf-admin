query GetPageSeo($slug: String!) {
  pageBlocks(slug: $slug) {
    slug
    title {
      uk
      en
    }
    description {
      uk
      en
    }
    keywords {
      uk
      en
    }
    canonicalUrl {
      uk
      en
    }
    coverImage {
      src
      alt {
        uk
        en
      }
    }
    allowIndexation {
      uk
      en
    }
    updatedAt
  }
}
