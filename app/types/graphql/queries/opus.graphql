query OpusById($id: ID!) {
  opusById(id: $id) {
    id
    number
    numberKind
    title {
      uk
      en
    }
    releaseYear
    name
    additionalText
    creationYear
    endYear
    datesNote
    genre
    adminTitle
    slug
    status
    description {
      uk
      en
    }
    keywords {
      uk
      en
    }
    allowIndexation {
      uk
      en
    }
    coverImage {
      src
      alt {
        uk
        en
      }
      crop {
        x
        y
        width
        height
      }
    }
    compositions {
      id
      opusId
      title {
        uk
        en
      }
      year
      genre
      audioAvailable
      sheetAvailable
      sheetMusic {
        url
        name
        publishDate
        isFree
        dateUploaded
      }
      audios {
        name
        url
      }
    }
    publishedAt
    createdAt
    updatedAt
  }
}

query AllOpuses($filters: OpusFiltersInput) {
  allOpuses(filters: $filters) {
    id
    number
    numberKind
    title {
      uk
      en
    }
    genre
    status
    creationYear
    endYear
    updatedAt
    createdAt
    compositions {
      id
      title {
        uk
        en
      }
    }
  }
}

query SearchCompositions($search: String!) {
  searchCompositions(search: $search) {
    id
    opusId
    title {
      uk
      en
    }
    year
    genre
    audioAvailable
    sheetAvailable
    sheetMusic {
      url
      name
      publishDate
      isFree
      dateUploaded
    }
    audios {
      name
      url
    }
  }
}
