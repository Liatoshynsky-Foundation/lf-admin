fragment NewsFields on News {
  id
  adminTitle
  title { uk en }
  slug
  description { uk en }
  keywords { uk en }
  content { uk en }
  coverImage {
    src
    alt { uk en }
    caption { uk en }
    isTmp
    width
    height
  }
  status
  allowIndexation { uk en }
  newsDate
  publishedAt
  createdAt
  updatedAt
  meta { views }
}

query NewsById($id: ID!) {
  newsById(id: $id) {
    ...NewsFields
  }
}

query NewsBySlug($slug: String!) {
  newsBySlug(slug: $slug) {
    ...NewsFields
  }
}

query AllNews($filters: NewsFiltersInput) {
  allNews(filters: $filters) {
    id
    adminTitle
    title { uk en }
    slug
    status
    newsDate
    publishedAt
    meta { views }
  }
}

query PublishedNews($filters: NewsFiltersInput) {
  publishedNews(filters: $filters) {
    id
    title { uk en }
    slug
    coverImage {
      src
      alt { uk en }
    }
    newsDate
    publishedAt
    meta { views }
  }
}

query DraftNews($filters: NewsFiltersInput) {
  draftNews(filters: $filters) {
    id
    adminTitle
    updatedAt
  }
}

query PaginatedNews($page: Int!, $limit: Int!, $filters: NewsFiltersInput) {
  paginatedNews(page: $page, limit: $limit, filters: $filters) {
    items {
      id
      adminTitle
      title { uk en }
      slug
      status
      newsDate
      publishedAt
      coverImage {
        src
      }
    }
    total
    page
    totalPages
  }
}

query NewsCount($status: NewsStatus) {
  newsCount(status: $status)
}