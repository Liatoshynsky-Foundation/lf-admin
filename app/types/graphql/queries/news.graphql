query NewsById($id: ID!) {
  newsById(id: $id) {
    id
    publishedAt
    newsDate
    createdAt
    updatedAt
    title {
      uk
      en
    }
    description {
      uk
      en
    }
    content {
      uk
      en
    }
    slug
    coverImage {
      src
      alt {
        uk
        en
      }
      caption {
        uk
        en
      }
      isTmp
    }
    status
    meta {
      views
    }
  }
}

