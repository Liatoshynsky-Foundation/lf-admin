query PaginatedNews($page: Int = 1, $limit: Int = 10, $filters: NewsFiltersInput) {
  paginatedNews(page: $page, limit: $limit, filters: $filters) {
    news {
      id
      publishedAt
      newsDate
      createdAt
      updatedAt
      title {
        uk
        en
      }
      description {
        uk
        en
      }
      content {
        uk
        en
      }
      slug
      coverImage {
        src
        alt {
          uk
          en
        }
        caption {
          uk
          en
        }
        isTmp
      }
      status
      meta {
        views
      }
    }
    total
    page
    totalPages
  }
}

query NewsCount($status: NewsStatus) {
  newsCount(status: $status)
}
