query AllAssets($filters: AssetsFiltersInput) {
  allAssets(filters: $filters) {
    id
    type
    tags
    usageRefs {
      pageId
      blockId
      locale
    }
    filename
    originalname
    mimeType
    sizeBytes
    url
    createdBy
    description
    isStarred
    createdAt
    updatedAt
  }
}
