mutation UpdateAsset($id: ID!, $input: UpdateAssetInput!) {
  updateAsset(id: $id, input: $input) {
    id
    isStarred
    filename
    description
    updatedAt
  }
}

mutation CreateAsset($input: CreateAssetInput!) {
  createAsset(input: $input) {
    id
    filename
    url
    mimeType
    type
  }
}

mutation DeleteAsset($id: ID!) {
  deleteAsset(id: $id)
}
