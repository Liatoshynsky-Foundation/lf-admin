enum SocialNetworkTypes {
  facebook
  instagram
  linkedin
  tiktok
  youtube
  anotherMedia
}

type ContactInformation {
  foundationName: LocalizedString!
  address: LocalizedString!
  email: String!
  phone: String!
}

type SocialNetwork {
  platform: SocialNetworkTypes!
  url: String!
}

type Contacts {
  contactInformation: ContactInformation!
  socialNetworks: [SocialNetwork!]!
}

input ContactInformationInput {
  foundationName: LocalizedStringInput!
  email: String!
  phone: String!
  address: LocalizedStringInput!
}

input SocialNetworkInput {
  platform: SocialNetworkTypes!
  url: String!
}

input UpdateContactsInput {
  contactInformation: ContactInformationInput!
  socialNetworks: [SocialNetworkInput!]
}

extend type Query {
  contacts: Contacts!
}

extend type Mutation {
  updateContacts(input: UpdateContactsInput!): Contacts!
}
