scalar JSON

type Page {
    id: ID!
    slug: String!
    title: LocalizedString!
    status: String!
    pageType: String!
    blocks: JSON!
    createdAt: String!
    updatedAt: String!
}

type LocalizedString {
    uk: String
    en: String
}

extend type Query {
    pageBlocks(slug: String!): Page
}