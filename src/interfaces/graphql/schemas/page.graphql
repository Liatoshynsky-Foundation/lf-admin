scalar JSON

type LocalizedString {
  uk: String
  en: String
}

type PageCoverImage {
  src: String!
  alt: LocalizedString!
}

enum PageCategories {
  borys_liatoshynsky
  foundation
  cooperation
  archive
  other
}

type Page {
  id: ID!
  slug: String!
  title: LocalizedString!
  status: String!
  category: PageCategories!
  coverImage: PageCoverImage!
  blocks: JSON!
  blocksOrder: [String!]!
  createdAt: String!
  updatedAt: String!
  description: LocalizedString!
  keywords: LocalizedString
  canonicalUrl: LocalizedString
  allowIndexation: LocalizedBoolean!
}

extend type Query {
  pageBlocks(slug: String!, status: String = "published"): Page
  pages(category: PageCategories): [Page!]!
}

input UpdatePageBlocksInput {
  slug: String!
  blocks: JSON!
}

input UpdatePageSeoInput {
  slug: String!
  title: JSON
  description: JSON
  keywords: JSON
  canonicalUrl: JSON
  allowIndexation: JSON
}

extend type Mutation {
  updatePageSeo(input: UpdatePageSeoInput!): Page!
}

input UpsertPageDraftInput {
  slug: String!
  blocks: JSON!
  blocksOrder: [String!]!
}

input PublishPageInput {
  slug: String!
  blocks: JSON
  blocksOrder: [String!]!
}

extend type Mutation {
  updatePageBlocks(input: UpdatePageBlocksInput!): Page!
  upsertPageDraft(input: UpsertPageDraftInput!): Page!
  publishPage(input: PublishPageInput!): Page!
}
