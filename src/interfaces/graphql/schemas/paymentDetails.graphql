type PaymentDetailsPdfFile {
  filename: String!
  url: String!
  mimeType: String!
}

type PaymentDetailsTab {
  id: ID!
  name: String!
  content: JSON!
  order: Int!
}

type PaymentDetails {
  id: ID!
  slug: String!
  tabs: [PaymentDetailsTab!]!
  pdfFile: PaymentDetailsPdfFile
  createdAt: String!
  updatedAt: String!
}

input PaymentDetailsPdfFileInput {
  filename: String!
  url: String!
  mimeType: String!
}

input PaymentDetailsTabInput {
  id: ID
  name: String!
  content: JSON!
}

input UpdatePaymentDetailsInput {
  tabs: [PaymentDetailsTabInput!]!
  pdfFile: PaymentDetailsPdfFileInput
}

extend type Query {
  paymentDetails: PaymentDetails
}

extend type Mutation {
  updatePaymentDetails(input: UpdatePaymentDetailsInput!): PaymentDetails!
}
