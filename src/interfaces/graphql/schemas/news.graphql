enum NewsStatus {
  draft
  published
  hidden
  archived
  editing
}

type News implements BaseContent {
  id: ID!
  adminTitle: String!
  title: LocalizedString!
  slug: String!
  description: LocalizedString!
  keywords: LocalizedString!
  content: LocalizedJSON!
  coverImage: LocalizedImage!
  status: NewsStatus!
  allowIndexation: LocalizedBoolean!
  newsDate: String
  createdAt: String!
  updatedAt: String!
  publishedAt: String
  meta: ContentMeta!
}

type PaginatedNews {
  news: [News!]!
  total: Int!
  page: Int!
  totalPages: Int!
}

enum NewsSortBy {
  createdAt
  updatedAt
  publishedAt
  newsDate
}

input NewsSortOptions {
  field: NewsSortBy!
  order: SortOrder!
}

input NewsFiltersInput {
  status: NewsStatus
  limit: Int
  skip: Int
  slug: String
  sort: [NewsSortOptions!]
}

input CreateNewsInput {
  adminTitle: String!
  title: JSON!
  description: JSON!
  keywords: JSON!
  allowIndexation: JSON!
  content: JSON!
  coverImage: JSON!
  newsDate: String
  status: NewsStatus
  publishedAt: String
}

input UpdateNewsInput {
  adminTitle: String
  title: JSON
  description: JSON
  keywords: JSON
  allowIndexation: JSON
  content: JSON
  coverImage: JSON
  newsDate: String
  status: NewsStatus
  publishedAt: String
}

input PublishNewsInput {
  id: ID!
  publishedAt: String
}

extend type Query {
  newsById(id: ID!): News
  newsBySlug(slug: String!): News
  allNews(filters: NewsFiltersInput): [News!]!
  publishedNews(filters: NewsFiltersInput): [News!]!
  draftNews(filters: NewsFiltersInput): [News!]!
  paginatedNews(page: Int!, limit: Int!, filters: NewsFiltersInput): PaginatedNews!
  newsCount(status: NewsStatus): Int!
}

extend type Mutation {
  createNews(input: CreateNewsInput!): News!
  updateNews(id: ID!, input: UpdateNewsInput!): News!
  deleteNews(id: ID!): Boolean!
  incrementNewsViews(id: ID!): News!
}
